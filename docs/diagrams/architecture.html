  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Public+Sans:wght@400;500;600;700&family=Red+Hat+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- Source for architecture.svg (profile: runsketch, see .diagram-design). Architecture grammar, doc-wide, left-to-right.
       Five open services, all reached from the page with no key and no backend of ours:
         Map tiles   OpenFreeMap vector tiles; Mapterhorn raster-DEM tiles for the hillshade layer
         Routing     BRouter, FOSSGIS OSRM and FOSSGIS Valhalla. The order is per profile, not fixed:
                     foot = OSRM then BRouter; hiking = BRouter, Valhalla, OSRM; alpine = BRouter then
                     Valhalla only; bike/road-bike/mtb = BRouter then OSRM; then a local straight line.
                     Valhalla also answers POST /trace_attributes for each leg, which is where surface,
                     sac_scale, bridge and tunnel come from -- BRouter returns no bridge or tunnel tags.
         Elevation   Mapterhorn z13, Mapterhorn z12, AWS Terrain Tiles z13, then the Open-Meteo point API
         Weather     Open-Meteo, chosen by the route's date: forecast, historical-forecast, archive
                     (ERA5), or a climatology "analog year" past the 15-day forecast horizon
         Search      Photon by komoot
       "No server of ours" is an editorial callout rather than a box: the browser-boundary zone and the
       legend already carry it, and a ninth node would spend the budget on a thing that does not exist. -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f5f6f4;
      --color-ink:    #1b1d22;
      --color-muted:  #474c55;
      --color-accent: #c21f3a;
      --font-sans:    'Public Sans', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', serif;
      --font-mono:    'Red Hat Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
