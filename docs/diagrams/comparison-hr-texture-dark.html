  <!-- Source for comparison-hr-texture-dark.svg (generated from comparison-hr-texture.html by token swap) (profile: runsketch, see .diagram-design). Line chart, doc-wide.
       Row 8 of docs/comparison.md. 120 samples at 1 Hz, the same window as the speed figure.
         Runsketch  flat 10 km at 5:00/km, chest strap, seed 3, seconds 1200-1319. Mean 170.3 bpm, 166-176.
         fenix2     the decoded 47-minute, 9 km file over the same offset. Mean 170.1 bpm, 166-174.
         fakemy.run computed from its published formula, not captured from the tool. Mean 149.3, 134-164.

       Unlike the speed figure, this one IS drawn on a shared absolute axis, because the two means agree to
       within 0.2 bpm (170.3 against 170.1) — there is no height mismatch to mislead anyone. fakemy.run sits
       about 20 bpm lower simply because its formula is anchored to a 150 bpm average, and the point of
       drawing it is the shape, not the level.

       The recorded file skipped 2 seconds in this window. They are drawn as GAPS, not interpolated.
       Ours and the file both move in small integer steps and hold a value for seconds at a time: the
       1 s change SD is 0.610 against 0.612 bpm and 64.3 % of seconds are unchanged against 63.8 %.
       fakemy.run redraws its noise at every track point at +/-15 bpm, so it jumps 134-164 second to second
       with no inertia at all -- the jagged band nothing in a real trace resembles. -->
