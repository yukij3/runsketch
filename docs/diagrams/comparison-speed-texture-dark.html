  <!-- Source for comparison-speed-texture-dark.svg (generated from comparison-speed-texture.html by token swap) (profile: runsketch, see .diagram-design). Line chart, doc-wide.
       Row 7 of docs/comparison.md. 120 samples at 1 Hz.
         Runsketch  flat 10 km at 5:00/km, chest strap, seed 3, seconds 1200-1319. Mean 3.436 m/s.
         fenix2     the decoded 47-minute, 9 km file over the same offset. Mean 3.949 m/s.
         fakemy.run computed from its published formula, not captured from the tool.

       EACH SERIES IS PLOTTED AS A PERCENTAGE OF ITS OWN MEAN. That is the whole reason the figure works:
       the excerpts average 3.44 and 3.95 m/s, so on a shared absolute axis the two traces would sit at
       visibly different heights and a reader would take that as a pace mismatch. This figure is about
       TEXTURE — the shape of the wobble — and says so on its face. Nothing here compares absolute pace.

       The recorded file skipped 2 seconds in this window. They are drawn as GAPS, not interpolated: a
       skipped second is part of what a real recording looks like.
       Deviation ranges over the window: Runsketch -10.1..+11.8 %, fenix 2 -2.8..+3.1 %, fakemy.run
       -1.5..+1.5 %. fakemy.run's band is narrow but has no memory from one second to the next: its lag-1
       autocorrelation is near zero where this recording sits at 0.948. -->
