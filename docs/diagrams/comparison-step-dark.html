  <!-- Source for comparison-step-dark.svg (generated from comparison-step.html by token swap) (profile: runsketch, see .diagram-design). Line chart, doc-wide.
       Row 4 of docs/comparison.md. Fraction of an instantaneous 60 bpm step (100 -> 160 bpm and back)
       completed over 300 s, sampled every 10 s.
       Runsketch: t63 = 50 s rising, 100 s recovering, a ratio of 2.0 for the default athlete. Fitness scales
       both (38/75 s fitter, 70/140 s less fit); only the default pair is drawn.
       Fake My Stats uses ONE pair for every transition, 28 s and 55 s, drawn here as 1-exp(-t/tau).
       The chart marks that a step is not a hill: on a real climb, where demand ramps in as the runner slows
       rather than stepping, our rise takes 104 s (row 3). The step number is the model's own time constant.
       For the rising side a treadmill study of eleven runners fitted 70.6 s first-order, or 18.6 s + 38.0 s
       second-order; our 50 s sits between the two fits. FOR THE RECOVERY SIDE THERE IS NO RUNNING REFERENCE
       AT ALL, so no reference band is drawn on either half. -->

    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 860px; display: block; }
  </style>
