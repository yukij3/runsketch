<!DOCTYPE html>

<head>

  <title>The effort model · Runsketch</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Public+Sans:wght@400;500;600;700&family=Red+Hat+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- Source for effort-model-dark.svg (generated from effort-model.html by token swap) (profile: runsketch, see .diagram-design). Flowchart grammar, doc-wide, left-to-right.
       Constants shown are the current engine values:
         models.ts  HILL_BETA_UP 0.7, HILL_BETA_DOWN 0.8, Kay blend by DESCENT_SKILL
         hr.ts      HR_TAU { vagalUp 10, vagalDown 30, sympatheticUp 50, sympatheticDown 100, sympatheticStopped 160 }
                    SLOW_COMPONENT { run 10, ride 15 }
       Node 00 is the weather path. One heat balance (weather/thermal.ts BodyHeat, a two-node core/skin
       model plus a muscle node) is stepped twice per second: once in the real weather, once for the same
       motion in neutral air (15 C, 60 %, calm, dry). Every weather effect is the difference between the
       two, so it is exactly zero in neutral conditions. That one shared state then forks:
         thermalPace()          -> Environment.thermal, a multiplier on the speed plan  ("pace factor")
         heatHeartRateShare()   -> DemandOptions.heat, folded into the drift budget     ("heat share")
       Drawn as one node with two labelled arrows because the fork is a shared body state, not a scalar
       index: pace reads skin, core, muscle and fluid loss; heart rate reads core and fluid loss only. -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #16181c;
      --color-ink:    #f5f6f4;
      --color-muted:  #b7bcb8;
      --color-accent: #ef6479;
      --font-sans:    'Public Sans', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', serif;
      --font-mono:    'Red Hat Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>

    <p class="eyebrow">Flowchart · Runsketch</p>
    <h1>One effort model, every channel</h1>

      <desc id="effort-model-dark-desc">Terrain grade sets a speed plan, the speed plan sets heart-rate demand, and fast vagal and slow sympathetic kinetics lag behind that demand to give recorded heart rate. Weather runs through a single heat balance that forks into both: a pace factor on the speed plan and a heat share folded into the heart-rate drift budget. Cadence, power, GPS error and altimeter come from the same run, and one seeded result feeds both the preview and the FIT, TCX and GPX files.</desc>

      </defs>

      <line x1="616" y1="238" x2="638" y2="238" stroke="#b7bcb8" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="816" y1="238" x2="838" y2="238" stroke="#ef6479" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
      <line x1="328" y1="154" x2="328" y2="174" stroke="#b7bcb8" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="528" y1="154" x2="528" y2="174" stroke="#b7bcb8" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="328" y1="302" x2="328" y2="354" stroke="#b7bcb8" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="928" y1="302" x2="928" y2="354" stroke="#b7bcb8" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="616" y1="402" x2="638" y2="402" stroke="#b7bcb8" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arrow labels (vertical segments: label to the side, 8px gap) -->

      <text x="540" y="170" fill="#b7bcb8" font-size="11" font-family="'Red Hat Mono', monospace">heat share</text>

      <text x="340" y="332" fill="#b7bcb8" font-size="11" font-family="'Red Hat Mono', monospace">v(t), grade(t)</text>

      <text x="256" y="74" fill="#9ba1a8" font-size="11" font-family="'Red Hat Mono', monospace" letter-spacing="0.12em">00</text>
      <text x="256" y="100" fill="#f5f6f4" font-size="16" font-weight="600" font-family="'Public Sans', sans-serif">Weather &amp; heat balance</text>
      <text x="256" y="124" fill="#b7bcb8" font-size="12" font-family="'Red Hat Mono', monospace">Open-Meteo: temperature, wind, rain, sun</text>

      <text x="856" y="270" fill="#b7bcb8" font-size="12" font-family="'Red Hat Mono', monospace">sensor noise</text>
      <text x="856" y="288" fill="#b7bcb8" font-size="12" font-family="'Red Hat Mono', monospace">integer bpm</text>

      <!-- ─── Node 06 · Other channels ─── -->
      <rect x="240" y="356" width="376" height="92" rx="6" fill="#16181c"/>
      <rect x="240" y="356" width="376" height="92" rx="6" fill="#1f2227" stroke="#f5f6f4" stroke-width="1"/>
      <text x="256" y="382" fill="#9ba1a8" font-size="11" font-family="'Red Hat Mono', monospace" letter-spacing="0.12em">06</text>

      <line x1="572" y1="508" x2="598" y2="508" stroke="#b7bcb8" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="700" y1="508" x2="726" y2="508" stroke="#ef6479" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
      <text x="736" y="512" fill="#b7bcb8" font-size="12" font-family="'Public Sans', sans-serif">Heart-rate path</text>
