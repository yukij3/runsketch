       Data: economyFactor(load, 0, level) from src/lib/sim/fatigue.ts, 0.5 km steps, no descent damage:
       1 + ECONOMY_LOSS * (1 - exp(-softplus(load - 4, 2) / 12)), ECONOMY_LOSS {"beginner": 0.09, "recreational": 0.05, "trained": 0.035, "elite": 0.025}.
       Multiplier at 10 / 20 / 40 / 80 km of load: {"beginner": [1.0358, 1.0663, 1.0855, 1.0898], "recreational": [1.0199, 1.0368, 1.0475, 1.0499], "trained": [1.0139, 1.0258, 1.0333, 1.0349], "elite": [1.01, 1.0184, 1.0238, 1.025]}.
       The softplus puts a hair above 1.000 at zero load (1.0019 for a beginner); invisible at this scale.
       "Most of it by 30 km": the saturation term is 0.885 at 30 km for every level, since only the ceiling varies.
       Values generated by a throwaway script that bundles src/lib/sim with rolldown and calls the functions. -->
