  <!-- Source for fatigue-riegel.svg (profile: runsketch, see .diagram-design). Line chart, doc-wide.
       Replaces the Riegel exponent and race-effort table in docs/fatigue.md.
       Data: presetGoal('run', 'race', t, { fitness }) from src/lib/sim/presets.ts, 3-minute steps from 30 min to 4 h:
       0.88 * (t / 1800)^(1/k - 1) past RACE_HOLD_S = 1800, RIEGEL_EXPONENT {"beginner": 1.09, "recreational": 1.08, "trained": 1.07, "elite": 1.06}.
       Goal at 30 min / 1 h / 2 h / 4 h: {"beginner": [0.88, 0.831, 0.7848, 0.7412], "recreational": [0.88, 0.836, 0.7941, 0.7544], "trained": [0.88, 0.841, 0.8037, 0.7681], "elite": [0.88, 0.8461, 0.8136, 0.7823]}.
       This is the goal the preset search aims at, not the effort a simulated run reaches.
       Values generated by a throwaway script that bundles src/lib/sim with rolldown and calls the functions. -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper: #f5f6f4; --color-ink: #1b1d22; --color-muted: #474c55; --color-accent: #c21f3a; --font-sans: 'Public Sans', system-ui, sans-serif; --font-serif: 'Instrument Serif', serif; --font-mono: 'Red Hat Mono', ui-monospace, monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1040px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 860px; display: block; }
  </style>
