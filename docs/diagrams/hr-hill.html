  <!-- Source for hr-hill.svg (profile: runsketch, see .diagram-design). Line chart, doc-wide.
       Data: real engine output at 42b6c04. simulate() from src/lib/sim with
       segmentProfile([3000 m 0 %, 800 m +8 %, 800 m -8 %, 400 m 0 %], smoothSigma 20 m),
       defaultAthlete() (age 35, rest 55, max 184, recreational), defaultSession('run') with pace 330 s/km,
       hrSensor 'strap', seed 42, variability 0.35 (the default). session.weather left absent, which is manual
       neutral air at session.temperatureC = 15 C, 60 % humidity, calm and dry.
       Series at 1 Hz, 1655 samples (27.6 min), unsmoothed as drawn.
       Grey is used twice, so the two are separated by value, not hue: the route elevation is background context
       (fill at 0.10, outline #8d939a at 0.4 / 0.8 px) while fakemy.run is one of the three data series
       (#474c55 at 0.5 / 0.7 px, a markedly darker grey). The legend swatches carry the same two weights.
       fakemy.run: avg*(0.7+0.3*sin(pi*i/N)) + U(-1,1)*v*avg, avg 150, v 0.10, N = 1655, noise from mulberry32(42).

       Climb starts t = 978 s (3 km), crest t = 1303 s (3.8 km), foot t = 1523 s (4.6 km).
       Lag figures are read off a 31 s moving average of both series, because recorded HR now carries
       minute-scale wander (sd 2.09 bpm detrended over 61 s) plus integer rounding: on the raw traces the
       single-second gap criterion is unstable (|HR-demand| <= 2 bpm held 30 s lands at climb+443 s, while the
       same test at 3 bpm lands at climb+4 s). Smoothed, the picture is steady:
         Climb: HR falls behind as the grade comes on, deepest at -6.2 bpm at climb+102 s, then crosses over and
                runs +3.1 / +5.9 / +7.0 bpm above demand at climb+150 / +180 / +240 s (slow component and drift).
                Smoothed HR over the climb: 165 -> 179 bpm.
         Crest: demand drops sharply, HR holds above it: +13.2 at the crest, peak +14.8 at crest+10 s, +12.3 at
                +30 s, +7.9 at +45 s. |gap| <= 5 bpm held 30 s from +54 s, <= 3 from +59 s, <= 2 from +118 s.
       Heart rate no longer pins at the maximum: it peaks at 181 bpm against HRmax 184, and only 18 of 1655
       samples (1.1 %) sit within 1 bpm of the run's own maximum. Demand peaks at 175.3.
       fakemy.run peaks at 164.7 bpm at t = 814 s, essentially half-time (N/2 = 827); over the climb its trend
       FALLS, 147 -> 133 bpm, and at the crest it reads 139.4. -->
