  <!-- Source for model-curves.svg (profile: runsketch, see .diagram-design). Two small line charts, doc-inline.
       Data: real engine output from src/lib/sim, 0.25 % grade steps and 1 Hz.

       Left panel, models.ts. runGradeMultiplier(g, skill, 0) with DESCENT_SKILL: the solid line is a
       recreational runner (skill 0.35), the shaded band runs from beginner (skill 0) to elite (skill 0.9).
       Uphill is F(g)^-HILL_BETA_UP with HILL_BETA_UP = 0.7 and is the same for every skill, so the band
       closes at 0 %. Measured: +10 % -> 0.736x, +20 % -> 0.529x, -25 % -> 0.731x (recreational).
       Recreational peak 1.159x at -9.0 %; beginner 1.126x at -8.0 %; elite 1.217x at -10.0 %.
       kayDownhill(g), the Kay (2012) quartic fitted to hill-race RECORDS, peaks at 1.228x at -10.25 %.
       It is drawn as the band's upper boundary because the elite blend tracks it within 0.015 (2.2 px)
       across the whole drawn range -- that coincidence is the point, so no second line is drawn.
       The descent caps (1.15 + 0.1*skill, i.e. 1.15 / 1.185 / 1.215 / 1.24) are NOT drawn: on smooth
       ground no curve reaches its cap, so a cap line would imply a limit that never binds here.
       walkGradeMultiplier(g) is min(DOWNHILL_CAP, toblerShape(g)), peaking at 1.1912x at -5 %; the 1.2 cap
       is likewise never reached. Both multipliers are relative to that SAME gait's flat speed, so the
       walk line crossing above the run line near -5 % does not mean walkers outrun runners.
       Faint dotted reference costRun(0)/costRun(g): the speed that would hold energy cost per second
       constant. It leaves the top of the panel at -7.5 % and reaches 2.000x at -20 %.

       Right panel, hr.ts. hrKinetics(demand, n, tauScale 1, initial 120, {rest 55, max 185}, moving).
       Demand 120 bpm, 150 bpm for 0 < t <= 300 s, then 120 bpm. Vagal share is VAGAL_FRACTION 0.25 of
       reserve = 32.5 bpm, full at 87.5 bpm, so both steps run entirely on the sympathetic part.
       Measured off the traces: rise reaches 63 % of the 30 bpm step (138.90 bpm) at t = 50 s.
       HR at the step down = 149.93 bpm; 63 % of that fall takes 98 s with moving = 1 (HR_TAU
       sympatheticDown 100) and 159 s with moving = 0 (sympatheticStopped 160). The two branches share
       one rise, so only the recovery is drawn twice. Only `moving` differs between them; demand is held
       at 120 bpm in both so the panel isolates the time constant and nothing else.
       No measured reference band is drawn: there is no field study of HR lag for running on rolling
       ground, and the lab step tests that exist are cycle-ergometer work. -->
