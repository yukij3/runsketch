      <desc id="mountaineering-altitude-dark-desc">VO₂max, maximum heart rate and resting heart rate as a share of their sea-level values from 0 to 8849 m, for someone who has just arrived and for someone acclimatised three weeks or more. VO₂max falls in a straight line to 84 % at 2800 m and then faster with the thinner air: 89 % at 2000 m for both, then just arrived against three weeks 82 % and 83 % at 3000 m, 71 % and 74 % at 4000 m, 62 % and 66 % on Mont Blanc (4808 m), 53 % and 58 % on Elbrus (5642 m), 50 % and 55 % on Kilimanjaro (5895 m), 39 % and 45 % on Aconcagua (6961 m), 28 % and 36 % at 8000 m and 20 % and 28 % on Everest. Maximum heart rate stays put to about 620 m and falls further with acclimatisation: 98 % and 97 % at 2000 m, 95 % and 91 % at 4000 m, 91 % and 86 % on Elbrus and 84 % and 76 % on Everest. Resting heart rate rises from 1500 m: +2 % and +1 % at 2000 m, +16 % and +13 % at 4000 m, +38 % and +29 % on Elbrus, and it stops at +50 % from about 6400 m just arrived and 7200 m acclimatised. Open circles mark the measurements: Calbet's 54 % and 58.5 % at 5260 m, Operation Everest II's 28.3 % at 43 Torr, Lundby and van Hall's 155 of 186 bpm after weeks at 5400 m and 142–144 at 8750 m, and Karliner's resting 70 and 80 bpm against 57 at 5400 and 6300 m.</desc>
