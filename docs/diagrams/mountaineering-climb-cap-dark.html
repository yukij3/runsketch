  <!-- Source for mountaineering-climb-cap-dark.svg (generated from mountaineering-climb-cap.html by token swap) (profile: runsketch, see .diagram-design). Line chart, doc-wide.
       Data: real engine output from src/lib/sim (models.ts, ground.ts, alpine.ts), 50 m steps.
       Climbing rate = v * 0.3 * 3600 with v = loadedClimbSpeed(0.5 * budget, 0.3, snowFactors(1).cost = 1.075,
       packLoadFactor(8, 70), 2.1 + 0.87 kg), budget = (45 * f - 3.5) * altitudeEndurance(f, A), f = altitudeFactor(h, A).
       This is the cap as kinematics.ts computes it at ALPINE_CLIMB.share 0.5 before the ALPINE_MIN_SPEED floor.
       A = 0 just arrived, 0.5 a week (the mountaineering default), 1 three weeks.
       Checked against the table this chart replaces in docs/mountaineering.md (all equal):
         altitude      1000  3000  4000  5000  5642  6961  8000
         just arrived   471   361   278   201   159    86    41
         a week         473   368   294   223   183   110    63
         three weeks    475   375   310   246   208   136    87
       The budget falls under the 0.08 m/s floor (86.4 m/h on 30 %) from 7000 m just arrived, 7500 m after a week, 8050 m after three weeks.
       Grey boxes are the guide rates quoted in the doc (breaks included): 155-300 m/h at 4000-5000 m,
       140-260 at 5000-5900 m, 100-170 at 6000-7000 m. -->
