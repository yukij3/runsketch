       Checked against the table this chart replaces in docs/mountaineering.md (all equal):
         grade   -40   -30   -20   -10   -5    0   +5   +10  +15  +20  +30  +40

         m/h     656   653   604   422   226   0   180  300  357  371  369  358
       Uphill the Swiss vertical rate stays 357-372 m/h from +15 to +40 %; downhill it peaks at 659 m/h at -39 %.
       Tobler's vertical rate at the same 4.2 km/h is not drawn: 373 m/h at +15, 417 at +20, 441 at +30 and 414 at +40 %.
