  <!-- Source for physiology-age.svg (profile: runsketch, see .diagram-design). Line chart, doc-wide.
       Replaces the age table in docs/physiology.md.
       Data: ageVo2maxFactor(age) from src/lib/sim/athlete.ts, read straight off the function in half-year steps
       from 20 to 80 (no simulation). At the table ages: 25 1.02, 35 1, 45 0.945, 55 0.88, 65 0.805,
       75 0.72; at 80 0.67375. The function is flat at 1.02 below 25 and clamps age to 20..90.
       The engine gives 0.805 at 65 (1 - 0.005*30 - 0.00005*900); the old table and the code comment round it to 0.80.
       The dashed line is NOT Kaminsky's data: it is the doc's own round figure, a straight 0.1 per decade from 1.0
       at 35, drawn only to show which side of a population decline the engine sits on. Tanaka and Seals 2008 give no
       curve that could be plotted, so no trained-athlete line is drawn.
       Values generated by a throwaway script that bundles src/lib/sim with rolldown and calls the functions. -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper: #f5f6f4; --color-ink: #1b1d22; --color-muted: #474c55; --color-accent: #c21f3a; --font-sans: 'Public Sans', system-ui, sans-serif; --font-serif: 'Instrument Serif', serif; --font-mono: 'Red Hat Mono', ui-monospace, monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1040px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 860px; display: block; }
  </style>
</head>
