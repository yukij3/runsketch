<head>

  <title>How long an effort can be held · Runsketch</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Public+Sans:wght@400;500;600;700&family=Red+Hat+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- Source for physiology-endurance-dark.svg (generated from physiology-endurance.html by token swap) (profile: runsketch, see .diagram-design). Line chart, doc-wide.
       Replaces the window/margin table in docs/physiology.md.
       Data: the ENDURANCE table in src/lib/sim/simulate.ts (360 s +0.25, 900 s +0.18, 1800 s +0.13, 3600 s +0.09,
       10800 s +0.05) and fracLT from FITNESS in src/lib/sim/athlete.ts (0.70 / 0.75 / 0.83 / 0.88). The limit is
       min(1.05, fracLT + margin), exactly as enduranceWarning() computes it. Constants only, no simulation.
       Per level, windows 6 / 15 / 30 / 60 / 180 min: {"beginner": [0.95, 0.88, 0.83, 0.79, 0.75], "recreational": [1, 0.93, 0.88, 0.84, 0.8], "trained": [1.05, 1.01, 0.96, 0.92, 0.88], "elite": [1.05, 1.05, 1.01, 0.97, 0.93]}.
       The 1.05 cap binds for trained at 6 min (1.08 uncapped) and for elite at 6 and 15 min (1.13, 1.06); the doc
       does not mention the cap. The check only exists at the five windows, so every series carries its vertices;
       the straight segments between them are for reading, not values the engine uses.
       Values generated by a throwaway script that bundles src/lib/sim with rolldown and calls the functions. -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper: #16181c; --color-ink: #f5f6f4; --color-muted: #b7bcb8; --color-accent: #ef6479; --font-sans: 'Public Sans', system-ui, sans-serif; --font-serif: 'Instrument Serif', serif; --font-mono: 'Red Hat Mono', ui-monospace, monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1040px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 860px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Line chart · Runsketch</p>
    <h1>How long an effort can be held</h1>

    <svg viewBox="0 0 960 424" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="physiology-endurance-dark-title physiology-endurance-dark-desc">

      <desc id="physiology-endurance-dark-desc">Line chart of the longest-held effort the engine accepts, as a share of VO2 reserve, for averaging windows of 6, 15 and 30 minutes, 1 hour and 3 hours. The limit is the athlete's lactate-threshold share plus a margin that narrows from 0.25 at 6 minutes through 0.18, 0.13 and 0.09 to 0.05 at 3 hours, and never goes above 1.05. For a recreational athlete, threshold 0.75, that is 1.00 for 6 minutes, 0.93 for 15, 0.88 for half an hour, 0.84 for an hour and 0.80 for three hours. At 3 hours a beginner is allowed 0.75, a trained athlete 0.88 and an elite one 0.93; trained and elite limits are cut to 1.05 at the shortest windows.</desc>

      <text x="24.0" y="28.0" fill="#f5f6f4" font-size="13" font-weight="600" font-family="'Public Sans', sans-serif">How long an effort can be held</text>
      <text x="24.0" y="44.0" fill="#9ba1a8" font-size="10" font-family="'Red Hat Mono', monospace">highest mean share of VO2 reserve allowed over each window</text>

      <text x="274.0" y="310.0" fill="#ef6479" font-size="10" font-family="'Red Hat Mono', monospace" text-anchor="middle">+0.18</text>

      <circle cx="80.0" cy="98.0" r="2.5" fill="#9ba1a8"/>

      <circle cx="80.0" cy="124.0" r="2.5" fill="#ef6479"/>
      <circle cx="274.0" cy="160.4" r="2.5" fill="#ef6479"/>
      <circle cx="420.7" cy="186.4" r="2.5" fill="#ef6479"/>
      <circle cx="567.4" cy="207.2" r="2.5" fill="#ef6479"/>

      <text x="812.0" y="257.5" fill="#f5f6f4" font-size="10" font-family="'Red Hat Mono', monospace">0.75  beginner</text>
      <text x="812.0" y="231.5" fill="#ef6479" font-size="10" font-family="'Red Hat Mono', monospace">0.80  recreational</text>
