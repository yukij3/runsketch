  <!-- Source for recording-temperature-dark.svg (generated from recording-temperature.html by token swap) (profile: runsketch, see .diagram-design). Line chart, doc-wide.
       Replaces the one-row temperature table in the Temperature section of docs/recording.md.

       Data: real engine output from src/lib/sim at 57c45fe (0.2.0). simulate() with the default athlete, optical
       sensor, manual weather (60 % humidity, calm, dry) at each air temperature, start 2026-06-01 06:30Z, seeds 1-6.
       Value = mean of the recorded temperature stream over the last 600 s, then the mean over seeds.
         run  flatProfile(10000), 300 s/km (the scenario of the wrist test in sensors.test.ts)
         walk flatProfile(6000), 720 s/km (72 minutes, so the 10-minute sensor has settled)
         ride flatProfile(25000), 25 km/h, unit on the handlebar
       Means by air temperature -5 0 5 10 15 20 25 30 32 35 C:
         run  3.6 7.2 11.3 15.4 19.5 23.7 27.6 31.5 33.3 35.5   (seed range at 5 C 10.9-12.0, at 25 C 27.0-28.0)
         walk 12.9 16.5 18.9 20.8 21.8 25.4 28.8 31.9 33.2 35.0 (at 15 C 21.1-22.0)
         ride -4.7 0.3 5.3 10.3 15.3 20.3 25.3 30.3 32.3 35.3  (at 15 C 15.0-15.7)
       The sleeve callout is checked, not assumed: the clothing the heat balance chooses for this walk is 2.5 clo
       at -5 and 0 C, 2 at 5, 1.1 at 10, 0.8 at 15 and 0.5 from 20 C; a sleeve covers the watch from 0.9 clo
       (SLEEVE_CLO in simulate.ts). The run never reaches 0.9 clo in this range (0.65 at -5 C).
       The table this replaced gave 12 C for the run at 5 C and 27 C at 25 C; the current means are 11.3 and 27.6,
       inside the seed ranges above. Its other cells (19-20, 33, 21-22, 15-16) agree. -->
