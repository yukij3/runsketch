  <!-- Source for recording-texture.svg (profile: runsketch, see .diagram-design). Dot plot, doc-wide.
       Replaces the comparison table at the top of docs/recording.md.

       Data: real engine output from src/lib/sim at 57c45fe (0.2.0), measured with the statistics below.
       Runsketch columns: default athlete, chest strap, 'normal' GPS, manual 15 C, no stops, start 2026-06-01 06:30Z,
       mean of seeds 1-8. Flat = flatProfile(10000) at 300 s/km. City blocks = the cityBlocks() route of
       src/lib/sim/sensors.test.ts (200 m straights, alternating 90 degree turns, +-10 m every 2 km) at 290 s/km.
       Reference: activity-small-fenix2-run.fit from the python-fitparse test fixtures (Garmin fenix 2, 1 s, chest
       strap), decoded with fit-file-parser and run through THE SAME functions as the simulated streams.

       Window for every statistic: the steady middle, second 600 to end - 300, seconds with speed > 2 m/s
       (1848 s of the fenix 2 file). Moving averages are centred and of the stated width. Changes and the GPS step
       use consecutive steady seconds only. Speed spread = SD(speed - MA61) / mean speed. Lag-1 correlation of
       speed is taken on that detrended sequence. GPS step = planar distance between consecutive fixes. Cadence
       compares whole strides per minute (fenix: FIT cadence; Runsketch: floor(steps / 2)). Altitude steps are
       |delta| in 0.2 m buckets. Skipped seconds: fenix = gaps / intervals over the whole file (20 / 2808);
       Runsketch = gaps / written intervals of recordPlan() in src/lib/export/recording.ts.

       Measured values (fenix 2 / flat / city blocks):
         speed 1 s change SD       0.048 / 0.047 / 0.054 m/s
         speed spread around 61 s  4.42 / 4.09 / 4.17 %
         speed lag-1 correlation   0.948 / 0.941 / 0.930
         GPS step SD               0.922 / 0.828 / 0.882 m
         GPS step lag-1 corr.      0.728 / 0.626 / 0.639
         HR 1 s change SD          0.612 / 0.610 / 0.586 bpm
         HR seconds unchanged      63.8 / 64.3 / 66.4 %
         HR spread around 61 s     1.496 / 1.988 / 1.546 bpm
         HR spread around 121 s    2.442 / 3.244 / 2.495 bpm
         cadence strides unchanged 80.9 / 77.8 / 75.3 %
         skipped seconds           0.712 / 0.621 / 0.586 % of intervals
         altitude steps 0/0.2/0.4+ 48.0/45.0/7.0 . 52.6/44.4/3.0 . 46.8/47.3/5.9 %
       (fenix at 31 and 181 s: 0.947 and 3.371 bpm; flat 0.997 and 3.920; stated in the doc prose, not drawn.)
       The table this replaced printed the fenix speed change as 0.049, its lag-1 speed correlation as 0.94 and its
       GPS step correlation as 0.72; recomputed with the same code as the engine columns they are 0.048, 0.948 and
       0.728, which is what is drawn.

       x = Runsketch value as a share of the fenix 2 value, 70-140 %. Accent marks the one statistic that is out
       of family: heart-rate wander on the flat route, a third above the file at both 61 and 121 s. The city-block
       route sits next to the file on those rows, which is why both routes are drawn rather than their mean.
       The raw values are printed on the right so the dots never have to carry units. -->
