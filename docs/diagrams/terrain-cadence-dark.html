  <!-- Source for terrain-cadence-dark.svg (generated from terrain-cadence.html by token swap) (profile: runsketch, see .diagram-design). Line chart, doc-wide.
       Data: real engine output from src/lib/sim/models.ts, 0.5 % grade steps.
       Solid: runCadence(3.03 * runGradeMultiplier(g, 0.35), g, 1.75), the recreational runner at the speed each grade
       gives (3.03 m/s on the flat, descent skill 0.35). Dashed: runCadence(3.03, g, 1.75), the same speed everywhere.
       Height 1.75 m, so the stature term is zero. Below -15 % the steep-descent floor switches on, which is the small
       step in the solid line at -15 %. The uphill term eases from 0.25 % to 0.1 % per % at +12 %.
       Checked against the table this chart replaces in docs/terrain.md:
         own speed  -25 176.2, -10 173.5, 0 171.5, +10 169.3, +20 166.3   (table 176, 174, 172, 169, 166)
         3.03 m/s   -25 185.1, -10 169.8, 0 171.5, +10 175.8, +20 178.1   (table 185, 170, 172, 176, 178)
