  <!-- Source for terrain-descent.svg (profile: runsketch, see .diagram-design). Line chart, doc-wide.
       Data: real engine output from src/lib/sim/models.ts, 0.5 % grade steps from -40 to +40 %.

       trained 0.65, elite 0.9. Uphill every level is typicalRunGrade(g) = F(g)^-0.7, drawn once.
       Grey dashed: kayDownhill(g), Kay (2012) quartic fitted to hill-race records, peak 1.228x at -10.25 %.
       Checked against the table this chart replaces in docs/terrain.md (all equal to two decimals):
         beginner      -30 0.41, -20 0.75, -15 0.97, -10 1.12, -5 1.11 | +5 0.87, +10 0.74, +20 0.53, +30 0.42
         recreational  -30 0.60, -20 0.90, -15 1.06, -10 1.16, -5 1.12
         trained       -30 0.68, -20 0.97, -15 1.12, -10 1.19, -5 1.14 (not in the old table)
         elite         -30 0.71, -20 1.02, -15 1.16, -10 1.22, -5 1.15
       Peaks: beginner 1.126x at -8 %, recreational 1.159x at -9 %, trained 1.190x at -9.5 %, elite 1.217x at -10 %.

       The caps 1.15 + 0.1*skill are not drawn: on smooth ground no curve reaches its cap. -->
