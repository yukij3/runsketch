  <!-- Source for weather-ground.svg (profile: runsketch, see .diagram-design). Small multiples, doc-wide.
       Replaces the "ground, place by place" table in the worked example of docs/weather.md.

       Data: real engine output from src/lib/sim at 57c45fe (0.2.0). The example is rebuilt from the doc's own
       description, since no script for it is in the repo:
         route    pathProfile() from [7.75, 46.02], smoothSigma 20: 2 km paved SW +140 m; 3.5 km 'ground' W +540 m
                  (technicality 0.2); 2 km 'ground' W +283 m (0.3); 3 km 'rough' WSW +677 m (0.4); 150 m 'rough'
                  traverse, heading north (the doc does not give it); 2.85 km 'rough' ENE -677 m (0.4).
                  Gives 13.5 km, +1637 / -669 m, 1621 -> 3260 -> 2586 m, and weatherSamplePoints() picks exactly the
                  doc's nine points.
         weather  the doc's hourly columns at 1620 and 3260 m, every other point between them by height, hours before
                  06:00 and after 12:00 holding the nearest column, timezone Europe/Zurich, 2026-08-13..17.
                  Pressure below 3260 m is not in the doc; here it keeps a constant ratio to the 3260 m value,
                  the reconstruction that fits the doc's barometer column best (it does not change the ground).
         session  hike, 2026-08-15 06:00 CEST, default athlete, chest strap, no stops, default seed 833490389,
                  target = the Steady preset as a pace (1537 s/km, 0.651 m/s).
       The ground is read from the surface grid the run builds (precomputeSurface), at km 5, 9.5, 10.5 and 13 every
       5 minutes. It matches the replaced table within 0.01 at every cell, e.g. forest 0.13 / 0.84 / 0.85 /
       0.67 / 0.52 / 0.49 / 0.48, summit ice 0.35 at 08:30 (table 0.34), 1.00 at 09:00, 0.96 at 10:00, 0.02 at
       11:00, summit wetness 0.77 at 13:00 (table 0.76).
       "hiker" marks the minute the hiker reaches each place in that run (07:18, 09:26, 10:14, 11:33).
       Ice is drawn as a strip whose opacity is the frozen share of the film, because the doc's point is that it
       comes and goes gradually. -->
