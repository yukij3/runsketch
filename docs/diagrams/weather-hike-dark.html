  <!-- Source for weather-hike-dark.svg (generated from weather-hike.html by token swap) (profile: runsketch, see .diagram-design). Small multiples, doc-wide.
       Replaces the "what the hiker meets" table in the worked example of docs/weather.md.

       Data: real engine output from src/lib/sim at 57c45fe (0.2.0), the same rebuilt example and run as
       weather-ground.html (see its comment for the route, weather and session). Per-second conditions at the
       hiker come from the EnvironmentRecord the run records (recordEnvironment), sampled every 60 s; the wrist
       reading is the recorded temperature stream. Height is the smoothed route profile at the hiker's distance.
       Sunrise 06:34 is sunElevationDeg() crossing zero at the km 2 point, as the doc states.
       Against the replaced table (half-hour rows), air, precipitation, snow share, wind, wetness, snow depth,
       surface factor and wrist agree within rounding; the run reaches the top at 10:16 (doc 10:18) and finishes
       at 11:46 (doc 11:46). The Steady preset solves 0.651 m/s and 20 742 s of moving time here, 5 h 46 min,
       against the doc's 5 h 47 min.
       NOT DRAWN: the barometer column. It depends on surface pressure at the points below 3260 m, which the
       example never states. Three plausible reconstructions give 30-34 m high at 09:00 (doc 30) and 11-15 m low at
       08:00 (doc 12), so the column stays in the prose, where its three key readings already are.
       The one-sample headwind spike at the top (+5.9 m/s near 10:15) is the corner between the ridge and the
       150 m traverse: the direction of travel is taken over +-10 m, so a sharp corner swings it through the wind
       for a few seconds. The traverse heading is this reconstruction's assumption, so the spike is not part of
       the example's story and is not labelled; the labelled +5.2 is the largest value on the way up.
       Panel scales: height 1500-3300 m, air and wrist -4..20 C, precipitation 0-6 mm/h stacked as rain below snow,
       wind along the path -4..+6 m/s (positive = from ahead, at body height), underfoot 0-1 for wetness and the
       surface speed factor with fresh snow drawn as 0-5 cm on the same height. -->

      <desc id="weather-hike-dark-desc">Five stacked panels over the example hike from 06:00 to the finish at 11:46, sampled every minute: height, air temperature and the wrist reading, precipitation split into rain and snow, the wind along the path, and the ground underfoot. The hiker climbs from 1621 m to 3260 m, reached at 10:16, and comes down to about 2590 m. For the first hour the air stays at 6.7 to 7.0 °C while the height rises by some 450 m; it then falls to -1.3 °C at 09:58 near the top and is back above 5 °C on the way down. The wrist reads 8 °C at the start, 17 to 18 °C on the lower climb, 10 °C in the snow and wind near the summit and 11 to 16 °C coming down. Drizzle reaches the hiker at 07:30 and the downpour at 08:30 at 5.0 mm/h with 4 % snow, rising to 75 % snow at 09:00 and 98 % at 10:00. The wind along the path peaks at +5.2 m/s into the hiker&#x27;s face on the way up and turns to -3.3 m/s from behind at 10:30. The ground is fully wet from 08:30, fresh snow underfoot reaches 4.3 cm, and the surface speed factor falls from 1 to 0.87 at 09:00, 0.53 at 10:00 and 0.38 at 10:19 on the icy, snowy descent, recovering to 0.82 at 11:30.</desc>
