  <!-- Source for weather-sources-dark.svg (generated from weather-sources.html by token swap) (profile: runsketch, see .diagram-design). Timeline schematic, doc-wide.
       Replaces the source-by-date table in docs/weather.md. Structure read from planWeather() and fetchWeather()
       in src/lib/services/weather.ts at 57c45fe (0.2.0); no engine numbers.
         HISTORICAL_FORECAST_FROM = 2022-01-01, FORECAST_DAYS_AHEAD = 15, FORECAST_DAYS_BACK = 60,
         CLIMATOLOGY over the last ten complete years, analogYear() picks the year nearest the median.
         Classification is by the activity's first day in UTC days from today: > today + 15 -> climatology;
         >= yesterday -> forecast (+ climatology for days past the horizon); before 2022 -> archive with
         models=best_match; otherwise historical-forecast.
         NEXT_SOURCE: forecast -> historical-forecast -> archive when a host rejects a date.
         blendIntoAnalog(): the three hours after the last forecast hour move 1/4, 1/2, 3/4 toward the analog year.
       The axis is deliberately not to scale: the historical-forecast span is years and the forecast window is 16
       days, and the diagram is about which source answers, not how long each span is. Break marks sit on the
       three date boundaries. -->

      <desc id="weather-sources-dark-desc">Which Open-Meteo source serves an activity date, counted in UTC days from today. Before 2022 the historical weather API answers with its best match: ERA5 and ERA5-Land reanalysis and the ECMWF IFS analysis from 2017. From 1 January 2022 to the day before yesterday the historical forecast API answers with the same forecast models stitched from the first hours of each run. From yesterday to 15 days ahead the forecast API answers, asked for past hours back to 60 days. Further ahead there is no forecast, so one real year out of the last ten, the one closest to the ten-year median, is moved onto the dates. When a host says a date is out of range the request falls back from forecast to historical forecast to archive; hours an archived forecast lacks are filled from the archive once, and gaps of up to three hours take the nearest valid hour. An activity that runs past the forecast horizon takes the past year for the remaining hours, blending over the first three hours a quarter, a half and three quarters of the way.</desc>
